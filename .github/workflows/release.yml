name: Release

# 推 v* tag 时自动构建并挂出 tgz；也可以在 Actions 里手动指定一个已有 tag 补发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要补发的 tag（例如 v0.2.0）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: 构建并发布 ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: 确认 tag 存在
        run: git rev-parse --verify "refs/tags/${TAG}"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验 tag 与清单版本一致
        run: |
          set -euo pipefail
          # 检出的是 tag 的树；补发老 tag 时树里还没有这个脚本（合并后才加的），从 main 取一份放回原位。
          if [ ! -f scripts/check-release-version.mjs ]; then
            git fetch --depth=1 origin main
            git show FETCH_HEAD:scripts/check-release-version.mjs > scripts/check-release-version.mjs
          fi
          node scripts/check-release-version.mjs "$TAG"

      - name: 安装依赖
        run: npm ci

      - name: 校验（typecheck + 单元测试）
        run: npm run verify

      - name: 构建（Java 桥接 + 宿主 + 客户端）
        run: npm run build

      - name: 打包
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist

      - name: 创建或补发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，替换附件"
            gh release upload "$TAG" dist/*.tgz --clobber
          else
            gh release create "$TAG" dist/*.tgz \
              --title "dsh-ide-database $TAG" \
              --generate-notes \
              --verify-tag
          fi
